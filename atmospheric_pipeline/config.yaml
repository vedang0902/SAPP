# Atmospheric Monitoring Pipeline - Configuration
# ----------------------------------------------

# Canonical sensor columns (Google Sheet: DateTime, WS, WD, Pressure, RH, Temp, Dew, Rain)
sensors:
  columns: ["ws", "wd", "pressure", "rh", "temp", "dew", "rain"]

# Sensor bounds for validation (keys match sensors.columns)
sensor_bounds:
  ws:
    min: 0.0
    max: 120.0
  wd:
    min: 0.0
    max: 360.0
  pressure:
    min: 800.0
    max: 1100.0
  rh:
    min: 0.0
    max: 100.0
  temp:
    min: -40.0
    max: 55.0
  dew:
    min: -50.0
    max: 50.0
  rain:
    min: 0.0
    max: 500.0

# Rolling window for feature engineering
feature_engineering:
  rolling_window: 6

# Filter parameters
filtering:
  median_window: 5
  kalman:
    process_variance: 0.01
    measurement_variance: 0.5
    estimated_error: 1.0

# Ingestion: Google Sheet as CSV over HTTP (not the /edit browser URL).
# Publish or link sharing must allow anonymous download.
# GOOGLE_SHEETS_CSV_URL overrides csv_export_url; do not use a literal "..." placeholder there (404).
# IITM_LARUS — tab Sheet1 gid=0:
ingestion:
  csv_export_url: "https://docs.google.com/spreadsheets/d/1C8gCSuv0S7vOiLFhqwwZffcU1GYHkBZjr6cncxXOAEo/export?format=csv&gid=0"
  interval_seconds: 60
  # When true, each successful sheet fetch overwrites master_sensor_data.csv (matches sheet).
  # When false, new rows are merged with the existing master (legacy append).
  replace_master_from_sheet: true

# Model parameters
model:
  isolation_forest:
    contamination: 0.04
    random_state: 42
  z_score:
    threshold: 3.0
  seasonal_decomposition:
    # One day of 1-minute samples (daily seasonality)
    period: 1440
    model: additive

# Hybrid Prediction (SARIMA + LSTM ensemble)
prediction:
  horizon: 6
  primary_sensor: temp
  sarima_order: [1, 1, 1]
  # Target: one day at 1-minute cadence (m=1440). Actual m is capped so length >= sarima_min_seasons * m.
  seasonal_order: [1, 1, 1, 1440]
  sarima_min_seasons: 10
  lstm:
    epochs: 24
    batch_size: 16
    lookback: 48
  ensemble_weights:
    sarima: 0.45
    lstm: 0.55
  forecast_error_threshold: 2.5
  error_window: 30
  history_limit: 360
  sarima_refit_interval: 30
  max_fast_forecast_rows: 120
  # Non-fast runs: only roll 1-step forecasts over the last N rows (then ffill earlier rows).
  # Full O(n) rolling is very slow (SARIMA + LSTM per row). Set to 0 to evaluate every row.
  rolling_forecast_tail_rows: 600

# Drift detection (Kolmogorov-Smirnov test)
drift:
  p_value_threshold: 0.05
  baseline_window: 120
  comparison_window: 60

# Paths
paths:
  input_stream: "data/stream"
  master_csv: "data/master_sensor_data.csv"
  output_csv: "output/anomaly_results.csv"
  invalid_log: "logs/invalid_rows.log"

# Alert service
alerts:
  slack_webhook_url: ""
